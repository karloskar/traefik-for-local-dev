services:
  traefik:
    image: traefik:v3.7.13
    # start with docker-compose up -d and let be alive
    restart: unless-stopped
    ports:
      # BIND_IP narrows what the proxy listens on. Leave it unset to publish on
      # every interface; set it in .env (e.g. 127.0.0.1) to keep it host-local.
      - "${BIND_IP:-0.0.0.0}:80:80"
      - "${BIND_IP:-0.0.0.0}:443:443"
      # for the local admin UI
      - "${BIND_IP:-0.0.0.0}:8181:8181"
    extra_hosts:
      # needed for routers/services provided from files.
      # host-gateway is right for rootful Docker. Under rootless Docker it
      # resolves to the network namespace's bridge gateway, which is not the
      # host, so set HOST_GATEWAY in .env to the address that is (10.0.2.2 for
      # slirp4netns, unless dockerd-rootless runs with --disable-host-loopback).
      - "host.docker.internal:${HOST_GATEWAY:-host-gateway}"
    logging:
      options:
        max-size: "1m"
    volumes:
      # a directory where dynamic file configs can be placed
      - ./dynamic:/etc/traefik/sites.d
      # dev certs
      - ./local-certs:/etc/traefik/certs
      # The Docker socket. Rootless Docker serves it from $XDG_RUNTIME_DIR
      # instead; override the source path in compose.override.yaml, which
      # replaces this bind because they share a container path.
      - /var/run/docker.sock:/var/run/docker.sock
      # For resolver cert storage
      - ./letsencrypt:/letsencrypt
    stop_signal: SIGINT
    command:
      - "--api"
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--entrypoints.http.address=:80"
      - "--entrypoints.https.address=:443"
      - "--entrypoints.https.forwardedheaders.trustedips=127.0.0.1/32"
      - "--entrypoints.traefik.address=:8181"
      - "--log.level=ERROR"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.file.directory=/etc/traefik/sites.d/"

networks:
  default:
    # Created once by hand, not by Compose — see the README. Compose deletes a
    # network it owns on `down`, which orphans every other project's stopped
    # containers on the old network id. External means it outlives this stack.
    name: localdevelopment
    external: true
